name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Allow the tag build to create/update the GitHub release.
permissions:
  contents: write

jobs:
  # Build and unit-test the platform-independent core on Linux (the DLL target
  # is Windows-only and is skipped here).
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Build the Notepad++ plugin DLL with MSVC, run the core tests, and publish
  # the DLL as a downloadable artifact. CMake fetches the Npp SDK headers.
  plugin-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # On a v* tag, fail fast unless the tag matches the single source-of-truth
      # version in CMakeLists.txt — so a release can't ship a mismatched version.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(NppAnsiColor VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "tag version = $tag ; CMakeLists version = $ver"
          if ($tag -ne $ver) {
            Write-Error "Tag v$tag does not match CMakeLists project version $ver. Bump project(... VERSION) and retag."
            exit 1
          }

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: ANSI_COLOR_TEXT-dll-x64
          path: build/Release/ANSI_COLOR_TEXT.dll
          if-no-files-found: error

      # On a v* tag, attach the freshly built DLL to the GitHub release
      # (creating the release with auto-generated notes if it does not exist).
      - name: Publish DLL to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag build/Release/ANSI_COLOR_TEXT.dll --clobber
